name: bindings/java

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Run at 8:00 AM every day
    - cron: "0 8 * * *"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit # Audit network and disk activity

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: 8
          distribution: "corretto"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Building binding
        run: |
          cargo clippy --all-targets --no-deps -- -Dwarnings
          cargo build --release --manifest-path bindings/java/Cargo.toml --locked

      - name: Build jar
        run: mvn package
        working-directory: ./bindings/java

      - name: Test jar
        run: |
          javac -cp target/regorus-java-0.2.2.jar Test.java
          java -Djava.library.path=target/release -cp target/regorus-java-0.2.2.jar:. Test
        working-directory: ./bindings/java
